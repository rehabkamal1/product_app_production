server {
  listen       80;
  server_name  _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: set far-future cache for static assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|otf)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page  500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
